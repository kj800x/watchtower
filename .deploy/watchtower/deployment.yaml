apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: watchtower
  name: watchtower
  namespace: cicd
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: watchtower
  template:
    metadata:
      labels:
        app: watchtower
    spec:
      containers:
        - command:
            - watchtower
          env:
            - name: DATABASE_PATH
              value: /data/db.db
          image: ghcr.io/kj800x/watchtower:commit-$SHA
          name: watchtower
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /data
              name: watchtower-data
      imagePullSecrets:
        - name: ghcr-kj800x
      volumes:
        - name: watchtower-data
          # Pinned to the NAS by the node selector, so the sqlite database is
          # read from the local dataset rather than over NFS from the same
          # node (which costs about 2 ms per query in lock round trips).
          hostPath:
            path: /data/services/watchtower
            type: Directory
      nodeSelector:
        dedicated: nas
